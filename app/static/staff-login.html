<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Đăng nhập quản trị · JinHunt</title><link rel="stylesheet" href="/static/staff.css"><script src="/static/staff-login.js" defer></script></head><body class="staff-login"><main class="login-card"><a class="brand" href="/">◈ JinHunt</a><p class="eyebrow">KHU VỰC VẬN HÀNH</p><h1>Đăng nhập quản trị</h1><p>Dành cho quản trị viên và kiểm duyệt viên đã được cấp quyền.</p><form id="staff-login-form"><label>Tên đăng nhập<input name="username" autocomplete="username" maxlength="254" required></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" maxlength="128" required></label><label>Mã từ ứng dụng xác thực<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="6 chữ số" required></label><p id="staff-login-message" role="alert"></p><button type="submit">Đăng nhập an toàn</button></form><p class="help">Chưa thiết lập hoặc mất ứng dụng xác thực? Liên hệ người vận hành server để cấp lại. Không gửi mật khẩu hay khóa OTP qua bình luận.</p><a href="/">‹ Về JinHunt</a></main></body></html>
